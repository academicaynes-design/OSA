<title>OSAMA</title>
<style>
:root{--bg:#06140f;--surface:#0c211a;--surface2:#112b22;--surface3:#17382c;--border:#1a3a2e;--border2:#27533f;--text:#eaf5ef;--muted:#8fb3a2;--muted2:#6f9886;--accent:#10b981;--accent-soft:rgba(16,185,129,.15);--accent2:#f5c451;--success:#22c55e;--danger:#ef4444;--warn:#f59e0b;--purple:#a78bfa;--radius:20px;--radius-sm:13px;--shadow:0 10px 34px rgba(0,0,0,.38);--shadow-sm:0 4px 14px rgba(0,0,0,.22);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif}
body.light{--bg:#f5f8f3;--surface:#fff;--surface2:#edf4ee;--surface3:#e1ede4;--border:#d6e5da;--border2:#bcd3c4;--text:#0b2a20;--muted:#53705f;--muted2:#7a9484;--accent:#0b9a6c;--accent-soft:rgba(11,154,108,.11);--shadow:0 10px 30px rgba(15,26,46,.10);--shadow-sm:0 4px 14px rgba(15,26,46,.07)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body[dir="rtl"]{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
button{font-family:inherit;font-size:14px;cursor:pointer}input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
#app{display:flex;min-height:100vh}
#sidebar{width:250px;flex-shrink:0;background:var(--surface);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .2s}
#sidebar.collapsed{width:70px}
.side-head{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border)}
.side-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0}
.side-title{font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sidebar.collapsed .side-title,#sidebar.collapsed .nav-label{display:none}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;margin-bottom:2px;border:1px solid transparent;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(16,185,129,.30);font-weight:600}
.nav-item svg{flex-shrink:0}
.side-foot{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.side-foot-text{font-size:12px;color:var(--muted2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidebar.collapsed .side-foot-text{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:62px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50}
#view{padding:22px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.view-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-weight:600;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface3)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g4,.g3,.g2{grid-template-columns:1fr}#view{padding:14px}#topbar{padding:0 14px}#sidebar{position:fixed;z-index:200;transform:translateX(-100%)}#sidebar.mobile-open{transform:none}}
.stat{display:flex;flex-direction:column;gap:4px}.stat .label{font-size:12.5px;color:var(--muted);font-weight:500}.stat .value{font-size:22px;font-weight:750;letter-spacing:-.02em}.stat .meta{font-size:12px;color:var(--muted2)}
.pos{color:var(--success)}.neg{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:90px;resize:vertical;line-height:1.55}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:start;padding:11px 14px;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}table.tbl tbody tr:hover{background:var(--surface2)}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.pill.green{background:rgba(34,197,94,.14);color:var(--success);border-color:rgba(34,197,94,.3)}
.pill.red{background:rgba(239,68,68,.14);color:var(--danger);border-color:rgba(239,68,68,.3)}
.pill.blue{background:var(--accent-soft);color:var(--accent);border-color:rgba(79,124,255,.3)}
.pill.amber{background:rgba(245,158,11,.14);color:var(--warn);border-color:rgba(245,158,11,.3)}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ico{font-size:34px;opacity:.5;margin-bottom:10px}
.empty h3{margin-bottom:6px;color:var(--text)}.empty p{margin:0 auto 16px;max-width:380px;font-size:13px}
.progress{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .4s}
.toast-wrap{position:fixed;bottom:20px;inset-inline-end:20px;z-index:900;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:11px 16px;border-radius:11px;box-shadow:var(--shadow);font-size:13px;animation:slideIn .2s ease;max-width:340px}
.toast.ok{border-inline-start:3px solid var(--success)}.toast.err{border-inline-start:3px solid var(--danger)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#modalRoot{position:fixed;inset:0;z-index:800;display:none}#modalRoot.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(3,7,18,.65);backdrop-filter:blur(3px)}
.modal{position:relative;margin:6vh auto;width:min(620px,94vw);max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border2);border-radius:18px;box-shadow:var(--shadow);animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:18px 18px 0 0}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}
.x-btn{background:transparent;border:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;border-radius:8px}.x-btn:hover{background:var(--surface2);color:var(--text)}
.chart-wrap{width:100%;overflow-x:auto}
svg.chart{display:block;width:100%;height:auto;min-width:320px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px}.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}.kv .v{font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 15px;border:none;background:transparent;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}.list-item:last-child{border-bottom:none}
.list-item .main{flex:1;min-width:0}.list-item .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-item .s{font-size:12px;color:var(--muted);margin-top:2px}
.checkbox{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.mono{font-variant-numeric:tabular-nums}
.help-text{font-size:12px;color:var(--muted2);line-height:1.6}
.divider{height:1px;background:var(--border);margin:16px 0}
.badge-count{background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;margin-inline-start:auto}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.kanban{grid-template-columns:1fr}}
.kanban-col{background:var(--surface2);border-radius:var(--radius);padding:12px;min-height:120px}
.kanban-col h4{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.kanban-card .t{font-weight:600;font-size:13.5px}.kanban-card .m{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ===== OSAMA look ===== */
#topBrand{display:none;font-weight:800;letter-spacing:.16em;font-size:13px;padding:5px 11px;border-radius:99px;background:linear-gradient(135deg,#10b981,#f5c451);color:#06231b}
.side-logo{background:linear-gradient(135deg,#10b981,#f5c451);color:#06231b;border-radius:50%;box-shadow:0 0 0 3px rgba(245,196,81,.25)}
.side-title{letter-spacing:.18em;font-weight:800}
#topbar{background:linear-gradient(90deg,var(--surface),var(--surface2));padding-top:env(safe-area-inset-top,0px);height:calc(62px + env(safe-area-inset-top,0px))}
.card{background:linear-gradient(160deg,var(--surface),var(--surface2));border-color:var(--border)}
.btn.primary{background:linear-gradient(135deg,#10b981,#0b9a6c);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.28)}
.nav-item.active{box-shadow:inset 3px 0 0 var(--accent2)}
body[dir=rtl] .nav-item.active{box-shadow:inset -3px 0 0 var(--accent2)}
@media(max-width:720px){
  #sidebar,#sidebar.collapsed,#sidebar.mobile-open{position:fixed!important;transform:none!important;inset:auto 0 0 0;top:auto;width:100%!important;height:calc(66px + env(safe-area-inset-bottom,0px));flex-direction:row;border-inline-end:0;border-top:1px solid var(--border);background:var(--surface);z-index:150;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 24px rgba(0,0,0,.28)}
  .side-head,.side-foot,#mobileMenu{display:none!important}
  #topBrand{display:inline-block}
  .nav{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px;gap:2px;scrollbar-width:none;flex:1}
  .nav::-webkit-scrollbar{display:none}
  .nav-item{flex-direction:column;gap:3px;padding:7px 4px;min-width:68px;justify-content:center;font-size:10.5px;margin:0;border-radius:14px}
  #sidebar.collapsed .nav-label{display:block!important}
  .nav-item.active{box-shadow:none;background:var(--accent-soft)}
  #view{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .toast-wrap{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}
</style>

/* ---------- DB ---------- */
const STORES={
  settings:{keyPath:'key'},accounts:{keyPath:'id'},categories:{keyPath:'id'},
  transactions:{keyPath:'id'},budgets:{keyPath:'id'},debts:{keyPath:'id'},debtPayments:{keyPath:'id'},
  recurring:{keyPath:'id'},goals:{keyPath:'id'},milestones:{keyPath:'id'},tasks:{keyPath:'id'},
  habits:{keyPath:'id'},habitLogs:{keyPath:'id'},notes:{keyPath:'id'},noteFolders:{keyPath:'id'},
  projects:{keyPath:'id'},projectMilestones:{keyPath:'id'},savingsGoals:{keyPath:'id'},savingsEntries:{keyPath:'id'},
  journal:{keyPath:'id'},attachments:{keyPath:'id'},activityLogs:{keyPath:'id'},archive:{keyPath:'id'}
};
let DB=null;const CACHE={};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const db=e.target.result;for(const n of Object.keys(STORES)){if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:STORES[n].keyPath});}};r.onsuccess=e=>{DB=e.target.result;res(DB);};r.onerror=e=>rej(e.target.error);});}
function tx(s,m){return DB.transaction(s,m).objectStore(s);}
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const dbAll=s=>reqP(tx(s,'readonly').getAll());
const dbPut=(s,o)=>reqP(tx(s,'readwrite').put(o));
const dbDel=(s,k)=>reqP(tx(s,'readwrite').delete(k));
async function refresh(s){CACHE[s]=await dbAll(s);return CACHE[s];}
async function loadAll(){for(const s of Object.keys(STORES))CACHE[s]=await dbAll(s);}
async function persist(s,o){await dbPut(s,o);await refresh(s);}

/* ---------- Settings ---------- */
const DEF={appName:'OSAMA',language:'en',theme:'dark',currency:'OMR',rates:{}};
let S={...DEF};
async function loadSettings(){const o={};(CACHE.settings||[]).forEach(r=>o[r.key]=r.value);S={...DEF,...o};if(S.appName==='LIFEOS')S.appName='OSAMA';LANG=S.language==='ar'?'ar':'en';document.body.classList.toggle('light',S.theme==='light');document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';document.body.dir=LANG==='ar'?'rtl':'ltr';$('#sideTitle').textContent=S.appName;$('#topBrand').textContent=S.appName;$('#sideLogo').textContent=S.appName[0].toUpperCase();}
async function saveSetting(k,v){S[k]=v;await persist('settings',{key:k,value:v});}
async function logActivity(kind,entity,id,msg){await persist('activityLogs',{id:uid(),kind,entity,entityId:id,message:msg,at:nowMs()});}

/* ---------- Money ---------- */
const prec=c=>PREC[c]!=null?PREC[c]:2;
function toMinor(str,c){const p=prec(c);const n=parseFloat(String(str).replace(/,/g,''));return isNaN(n)?0:Math.round(n*Math.pow(10,p));}
function fromMinor(m,c){const p=prec(c);return (m/Math.pow(10,p)).toFixed(p);}
function fmtMoney(m,c){const p=prec(c);return (m/Math.pow(10,p)).toLocaleString(undefined,{minimumFractionDigits:p,maximumFractionDigits:p})+' '+c;}
function toBaseMinor(m,c){const bp=prec(S.currency),p=prec(c);if(c===S.currency)return m;const r=S.rates[c]||1;return Math.round((m/Math.pow(10,p))*r*Math.pow(10,bp));}
function baseFmt(m){return fmtMoney(m,S.currency);}

/* ---------- Finance Engine ---------- */
function accountBalance(id){const a=CACHE.accounts.find(x=>x.id===id);if(!a)return 0;let b=a.openingBalance||0;for(const t of CACHE.transactions){if(t.deletedAt)continue;if(t.type==='income'&&t.accountId===id)b+=t.amountMinor;else if(t.type==='expense'&&t.accountId===id)b-=t.amountMinor;else if(t.type==='transfer'){if(t.accountId===id)b-=t.amountMinor;if(t.toAccountId===id)b+=(t.toAmountMinor!=null?t.toAmountMinor:t.amountMinor);}}return b;}
function accountBalanceBase(id){const a=CACHE.accounts.find(x=>x.id===id);if(!a)return 0;return toBaseMinor(accountBalance(id),a.currency);}
function monthRange(d){const dt=d?new Date(d):new Date();const s=new Date(dt.getFullYear(),dt.getMonth(),1);const e=new Date(dt.getFullYear(),dt.getMonth()+1,1);return [s.getTime(),e.getTime()];}
function dateMs(iso){if(!iso)return 0;const d=new Date(iso+'T00:00:00');return isNaN(d)?0:d.getTime();}
function financeTotals(from,to){let i=0,e=0;for(const t of CACHE.transactions){if(t.deletedAt)continue;const d=dateMs(t.date);if(from!=null&&d<from)continue;if(to!=null&&d>=to)continue;if(t.type==='income')i+=toBaseMinor(t.amountMinor,t.currency);else if(t.type==='expense')e+=toBaseMinor(t.amountMinor,t.currency);}return {income:i,expense:e,net:i-e};}
function debtOutstanding(d){const p=CACHE.debtPayments.filter(x=>x.debtId===d.id).reduce((s,x)=>s+x.amountMinor,0);return Math.max(0,d.amountMinor-p);}
function projectProgress(p){const ms=CACHE.projectMilestones.filter(m=>m.projectId===p.id);if(!ms.length)return 0;return Math.round(ms.filter(m=>m.done).length/ms.length*100);}

/* ---------- Charts ---------- */
function barChart(series,opt={}){const w=620,h=240,padL=54,padR=16,padT=16,padB=38,iw=w-padL-padR,ih=h-padT-padB;const max=Math.max(1,...series.map(s=>Math.abs(s.value)));const n=Math.max(1,series.length);const bw=Math.max(6,Math.min(46,(iw/n)*.62));const step=iw/n;let bars='';series.forEach((s,i)=>{const v=s.value,bh=Math.abs(v)/max*ih,x=padL+i*step+(step-bw)/2,y=v>=0?padT+ih-bh:padT+ih,color=v>=0?(opt.color||'#4f7cff'):'#ef4444';bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}" rx="4" fill="${color}" opacity=".9"/>`;bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-14}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(s.label)}</text>`;});let grid='';for(let g=0;g<=4;g++){const y=padT+ih-(ih*g/4);grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4" opacity=".6"/>`;}return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${grid}${bars}</svg>`;}
function lineChart(points,opt={}){const w=620,h=220,padL=54,padR=16,padT=16,padB=32,iw=w-padL-padR,ih=h-padT-padB;const max=Math.max(1,...points.map(p=>p.value));const n=Math.max(1,points.length-1);const px=i=>padL+(iw*i/Math.max(1,n)),py=v=>padT+ih-(v/max*ih);let path='';points.forEach((p,i)=>{path+=(i===0?'M':'L')+px(i).toFixed(1)+' '+py(p.value).toFixed(1)+' ';});let dots=points.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(p.value).toFixed(1)}" r="3.5" fill="${opt.color||'#22d3ee'}"/>`).join('');let labels=points.map((p,i)=>`<text x="${px(i).toFixed(1)}" y="${h-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p.label)}</text>`).join('');let grid='';for(let g=0;g<=4;g++){const y=padT+ih-(ih*g/4);grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4" opacity=".6"/>`;}return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${grid}<path d="${path}" fill="none" stroke="${opt.color||'#22d3ee'}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`;}

/* ---------- Modal ---------- */
function closeModal(){const r=$('#modalRoot');r.classList.remove('open');r.innerHTML='';}
function openModal(title,body,onMount,foot){const r=$('#modalRoot');r.innerHTML=`<div class="modal-backdrop" data-close></div><div class="modal" role="dialog"><div class="modal-head"><h2>${esc(title)}</h2><button class="x-btn" data-close aria-label="Close">&times;</button></div><div class="modal-body">${body}</div>${foot!==undefined?`<div class="modal-foot">${foot}</div>`:''}</div>`;r.classList.add('open');$$('[data-close]',r).forEach(el=>el.onclick=closeModal);if(onMount)onMount(r);}
function confirmDialog(title,msg,onOk,danger){openModal(title,`<p style="line-height:1.65;color:var(--muted)">${esc(msg)}</p>`,null,`<button class="btn" data-close>${t('cancel')}</button><button class="btn ${danger?'danger':'primary'}" id="cfmYes">${t('confirm')}</button>`);$('#cfmYes').onclick=()=>{closeModal();onOk();};}

/* ---------- Nav ---------- */
const NAV=[['dashboard','dashboard'],['finance','finance'],['goals','goals'],['tasks','tasks'],['habits','habits'],['savings','savings'],['projects','projects'],['notes','notes'],['journal','journal'],['analytics','analytics'],['search','search'],['activity','activity'],['archive','archive'],['settings','settings'],['help','help']];
let VIEW='dashboard';
function buildNav(){$('#nav').innerHTML=NAV.map(([id,k])=>`<div class="nav-item ${VIEW===id?'active':''}" data-view="${id}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[id]||ICONS.dashboard}"/></svg><span class="nav-label">${t(k)}</span></div>`).join('');$$('.nav-item').forEach(el=>{el.onclick=()=>{VIEW=el.dataset.view;buildNav();render();$('#sidebar').classList.remove('mobile-open');};});}
function navTitle(id){const n=NAV.find(x=>x[0]===id);return n?t(n[1]):'';}

/* ---------- Router ---------- */
function render(){$('#topTitle').textContent=navTitle(VIEW);const v=$('#view');try{switch(VIEW){case'dashboard':v.innerHTML=vDash();bindDash();break;case'finance':v.innerHTML=vFin();bindFin();break;case'goals':v.innerHTML=vGoals();bindGoals();break;case'tasks':v.innerHTML=vTasks();bindTasks();break;case'habits':v.innerHTML=vHabits();bindHabits();break;case'savings':v.innerHTML=vSavings();bindSavings();break;case'projects':v.innerHTML=vProjects();bindProjects();break;case'notes':v.innerHTML=vNotes();bindNotes();break;case'journal':v.innerHTML=vJournal();bindJournal();break;case'analytics':v.innerHTML=vAnalytics();break;case'search':v.innerHTML=vSearch();bindSearch();break;case'activity':v.innerHTML=vActivity();break;case'archive':v.innerHTML=vArchive();break;case'settings':v.innerHTML=vSettings();bindSettings();break;case'help':v.innerHTML=vHelp();break;}}catch(e){console.error(e);v.innerHTML=`<div class="card"><h2 style="color:var(--danger)">Error</h2><p class="help-text">${esc(e.message)}</p></div>`;}}

/* ---------- Dashboard ---------- */
function vDash(){const[ms,me]=monthRange();const ft=financeTotals(ms,me);const accs=CACHE.accounts.filter(a=>!a.archived);const tb=accs.reduce((s,a)=>s+accountBalanceBase(a.id),0);const open=CACHE.tasks.filter(x=>!x.deletedAt&&!x.archived&&x.status!=='done');const over=open.filter(x=>x.dueDate&&dateMs(x.dueDate)<nowMs());const g=CACHE.goals.filter(x=>!x.deletedAt&&x.status!=='completed');const h=CACHE.habits.filter(x=>!x.deletedAt&&!x.archived);const rn=[...CACHE.notes].filter(n=>!n.deletedAt).sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,4);const up=CACHE.tasks.filter(x=>!x.deletedAt&&x.status!=='done'&&x.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,5);return `<div class="view-head"><div><h1>${t('dashboard')}</h1><div class="sub">${new Date().toLocaleDateString(LANG==='ar'?'ar-OM':'en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" id="qaTx">+ ${t('finance')}</button><button class="btn sm" id="qaTask">+ ${t('tasks')}</button><button class="btn sm" id="qaNote">+ ${t('notes')}</button></div></div><div class="grid g4" style="margin-bottom:16px"><div class="card"><div class="stat"><span class="label">${t('balance')}</span><span class="value mono">${baseFmt(tb)}</span><span class="meta">${accs.length} ${LANG==='ar'?'حساب':'accounts'}</span></div></div><div class="card"><div class="stat"><span class="label">${t('income')}</span><span class="value mono pos">${baseFmt(ft.income)}</span></div></div><div class="card"><div class="stat"><span class="label">${t('expense')}</span><span class="value mono neg">${baseFmt(ft.expense)}</span></div></div><div class="card"><div class="stat"><span class="label">${t('overdue')}</span><span class="value mono ${over.length?'neg':'pos'}">${over.length}</span><span class="meta">${open.length} ${LANG==='ar'?'مهام مفتوحة':'open tasks'}</span></div></div></div><div class="grid g2" style="margin-bottom:16px"><div class="card"><h3 style="margin-bottom:14px">${LANG==='ar'?'التدفق النقدي (6 أشهر)':'Cash flow (6 months)'}</h3><div class="chart-wrap">${cashflowChart()}</div></div><div class="card"><h3 style="margin-bottom:14px">${LANG==='ar'?'المهام القادمة':'Upcoming tasks'}</h3>${up.length?up.map(x=>`<div class="list-item"><div class="main"><div class="t">${esc(x.title)}</div><div class="s">${esc(x.dueDate||'')} · ${esc(x.priority||'')}</div></div><span class="pill ${dateMs(x.dueDate)<nowMs()?'red':'blue'}">${esc(x.dueDate||'')}</span></div>`).join(''):`<div class="empty" style="padding:18px"><p>${t('noData')}</p></div>`}</div></div><div class="grid g3"><div class="card"><h3 style="margin-bottom:12px">${t('goals')}</h3>${g.length?g.slice(0,4).map(x=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${esc(x.title)}</span><span class="mono">${x.progress||0}%</span></div><div class="progress"><div style="width:${clamp(x.progress||0,0,100)}%"></div></div></div>`).join(''):`<div class="empty" style="padding:18px"><p>${t('noData')}</p></div>`}</div><div class="card"><h3 style="margin-bottom:12px">${t('habits')}</h3>${h.length?h.slice(0,4).map(x=>{const d=CACHE.habitLogs.some(l=>l.habitId===x.id&&l.date===todayISO()&&l.done);return `<div class="list-item" style="padding:8px 0"><input type="checkbox" class="checkbox habitDash" data-id="${x.id}" ${d?'checked':''}><div class="main"><div class="t" style="font-size:13px">${esc(x.name)}</div></div></div>`;}).join(''):`<div class="empty" style="padding:18px"><p>${t('noData')}</p></div>`}</div><div class="card"><h3 style="margin-bottom:12px">${t('notes')}</h3>${rn.length?rn.map(n=>`<div class="list-item" style="padding:8px 0"><div class="main"><div class="t" style="font-size:13px">${esc(n.title||'(untitled)')}</div><div class="s">${new Date(n.updatedAt).toLocaleDateString()}</div></div></div>`).join(''):`<div class="empty" style="padding:18px"><p>${t('noData')}</p></div>`}</div></div>`;}
function cashflowChart(){const m=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const s=d.getTime(),e=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();const ft=financeTotals(s,e);m.push({label:d.toLocaleDateString(LANG==='ar'?'ar-OM':'en',{month:'short'}),value:ft.net});}return barChart(m);}
function bindDash(){$('#qaTx')&&($('#qaTx').onclick=()=>{VIEW='finance';buildNav();render();setTimeout(openTxModal,50);});$('#qaTask')&&($('#qaTask').onclick=()=>{VIEW='tasks';buildNav();render();setTimeout(openTaskModal,50);});$('#qaNote')&&($('#qaNote').onclick=()=>{VIEW='notes';buildNav();render();setTimeout(openNoteModal,50);});$$('.habitDash').forEach(cb=>{cb.onchange=async()=>{const d=todayISO();let l=CACHE.habitLogs.find(x=>x.habitId===cb.dataset.id&&x.date===d);if(l){l.done=cb.checked;await persist('habitLogs',l);}else{await persist('habitLogs',{id:uid(),habitId:cb.dataset.id,date:d,done:cb.checked,createdAt:nowMs()});}};});}

/* ---------- Finance ---------- */
let finTab='transactions';
function vFin(){const accs=CACHE.accounts.filter(a=>!a.archived);const tb=accs.reduce((s,a)=>s+accountBalanceBase(a.id),0);const[ms,me]=monthRange();const ft=financeTotals(ms,me);return `<div class="view-head"><div><h1>${t('finance')}</h1><div class="sub">${LANG==='ar'?'الحسابات والمعاملات والميزانيات':'Accounts, transactions & budgets'}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" id="addTx">+ ${LANG==='ar'?'معاملة':'Transaction'}</button><button class="btn sm" id="addAcc">+ ${t('account')}</button><button class="btn sm" id="addBud">+ ${LANG==='ar'?'ميزانية':'Budget'}</button><button class="btn sm" id="addDebt">+ ${LANG==='ar'?'دين':'Debt'}</button></div></div><div class="grid g4" style="margin-bottom:16px"><div class="card"><div class="stat"><span class="label">${t('total')} ${t('balance')}</span><span class="value mono">${baseFmt(tb)}</span></div></div><div class="card"><div class="stat"><span class="label">${t('income')}</span><span class="value mono pos">${baseFmt(ft.income)}</span></div></div><div class="card"><div class="stat"><span class="label">${t('expense')}</span><span class="value mono neg">${baseFmt(ft.expense)}</span></div></div><div class="card"><div class="stat"><span class="label">${LANG==='ar'?'صافي':'Net'}</span><span class="value mono ${ft.net>=0?'pos':'neg'}">${baseFmt(ft.net)}</span></div></div></div><div class="tabs">${['transactions','accounts','budgets','debts'].map(tb2=>`<button class="tab ${finTab===tb2?'active':''}" data-tab="${tb2}">${({transactions:LANG==='ar'?'المعاملات':'Transactions',accounts:LANG==='ar'?'الحسابات':'Accounts',budgets:LANG==='ar'?'الميزانيات':'Budgets',debts:LANG==='ar'?'الديون':'Debts'})[tb2]}</button>`).join('')}</div><div>${finBody()}</div>`;}
function finBody(){if(finTab==='accounts')return accTable();if(finTab==='budgets')return budTable();if(finTab==='debts')return debtTable();return txTable();}
function txTable(){const l=[...CACHE.transactions].filter(x=>!x.deletedAt).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.createdAt-a.createdAt);if(!l.length)return `<div class="card empty"><div class="ico">💳</div><h3>${t('noData')}</h3><p>${LANG==='ar'?'أضف أول معاملة.':'Add your first transaction.'}</p><button class="btn primary" id="emptyTx">+ ${LANG==='ar'?'معاملة':'Transaction'}</button></div>`;return `<div class="card pad0"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('date')}</th><th>${t('type')}</th><th>${t('category')}</th><th>${t('account')}</th><th>${t('note')}</th><th style="text-align:end">${t('amount')}</th><th></th></tr></thead><tbody>${l.map(tr=>{const a=CACHE.accounts.find(x=>x.id===tr.accountId),c=CACHE.categories.find(x=>x.id===tr.categoryId),ta=CACHE.accounts.find(x=>x.id===tr.toAccountId);const tl=tr.type==='income'?t('income'):tr.type==='expense'?t('expense'):t('transfer');const cls=tr.type==='income'?'pos':tr.type==='expense'?'neg':'';return `<tr><td class="mono">${esc(tr.date)}</td><td><span class="pill ${tr.type==='income'?'green':tr.type==='expense'?'red':'blue'}">${tl}</span></td><td>${esc(c?c.name:'—')}${tr.type==='transfer'?` → ${esc(ta?ta.name:'—')}`:''}</td><td>${esc(a?a.name:'—')}</td><td>${esc(tr.note||'')}</td><td class="mono ${cls}" style="text-align:end">${tr.type==='expense'?'-':tr.type==='income'?'+':''}${esc(fmtMoney(tr.amountMinor,tr.currency))}</td><td style="text-align:end;white-space:nowrap"><button class="btn ghost sm txEdit" data-id="${tr.id}">✎</button><button class="btn ghost sm txDel" data-id="${tr.id}">🗑</button></td></tr>`;}).join('')}</tbody></table></div></div>`;}
function accTable(){const l=CACHE.accounts.filter(a=>!a.archived);if(!l.length)return `<div class="card empty"><div class="ico">🏦</div><h3>${t('noData')}</h3></div>`;return `<div class="card pad0"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('name')}</th><th>${t('currency')}</th><th style="text-align:end">${t('balance')}</th><th></th></tr></thead><tbody>${l.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.currency)}</td><td class="mono" style="text-align:end">${esc(fmtMoney(accountBalance(a.id),a.currency))}</td><td style="text-align:end"><button class="btn ghost sm accArch" data-id="${a.id}">📦</button></td></tr>`).join('')}</tbody></table></div></div>`;}

function bindHabits(){$('#addHabit')&&($('#addHabit').onclick=openHabitModal);$('#emptyHabit')&&($('#emptyHabit').onclick=openHabitModal);$$('.habitTog').forEach(cb=>cb.onchange=async()=>{const d=todayISO();let l=CACHE.habitLogs.find(x=>x.habitId===cb.dataset.id&&x.date===d);if(l){l.done=cb.checked;await persist('habitLogs',l);}else{await persist('habitLogs',{id:uid(),habitId:cb.dataset.id,date:d,done:cb.checked,createdAt:nowMs()});}render();});}

function vSavings(){const l=CACHE.savingsGoals.filter(x=>!x.deletedAt);return `<div class="view-head"><div><h1>${t('savings')}</h1></div><button class="btn primary sm" id="addSav">+ ${LANG==='ar'?'هدف توفير':'Savings goal'}</button></div>${l.length?`<div class="grid g3">${l.map(s=>{const bal=CACHE.savingsEntries.filter(x=>x.savingsGoalId===s.id).reduce((a,x)=>a+(x.amountMinor||0),0);const pct=s.targetMinor>0?Math.round(bal/s.targetMinor*100):0;return `<div class="card"><div style="font-weight:650">${esc(s.name)}</div><div class="help-text">${esc(fmtMoney(bal,s.currency))} / ${esc(fmtMoney(s.targetMinor,s.currency))}</div><div class="progress" style="margin:10px 0 6px"><div style="width:${clamp(pct,0,100)}%"></div></div><div class="help-text">${pct}%</div><button class="btn sm savAdd" data-id="${s.id}" style="margin-top:10px">+ ${LANG==='ar'?'إيداع':'Deposit'}</button></div>`;}).join('')}</div>`:`<div class="card empty"><div class="ico">💰</div><h3>${t('noData')}</h3><button class="btn primary" id="emptySav">+ ${LANG==='ar'?'هدف توفير':'Savings goal'}</button></div>`}`;}

function openSavModal(){openModal(LANG==='ar'?'هدف توفير':'New savings goal',`<div class="field"><label>${t('name')}</label><input class="input" id="sN"></div><div class="row"><div class="field"><label>${LANG==='ar'?'الهدف':'Target'}</label><input class="input mono" type="number" step="0.001" id="sT"></div><div class="field"><label>${t('currency')}</label><select class="input" id="sC">${CURRENCIES.map(c=>`<option value="${c}" ${c===S.currency?'selected':''}>${c}</option>`).join('')}</select></div></div>`,r=>{$('#sSave',r).onclick=async()=>{const n=$('#sN',r).value.trim();if(!n){toast('Name required','err');return;}const c=$('#sC',r).value;await persist('savingsGoals',{id:uid(),name:n,currency:c,targetMinor:toMinor($('#sT',r).value,c),createdAt:nowMs()});closeModal();render();toast(t('saved'),'ok');};},`<button class="btn" data-close>${t('cancel')}</button><button class="btn primary" id="sSave">${t('save')}</button>`);}

function openProjDetail(p){const ms=CACHE.projectMilestones.filter(m=>m.projectId===p.id);openModal(p.name,`<div style="display:flex;gap:8px;margin-bottom:14px"><input class="input" id="pmT" placeholder="${LANG==='ar'?'معلم جديد':'New milestone'}"><button class="btn primary" id="pmAdd">+</button></div><div>${ms.length?ms.map(m=>`<div class="list-item"><input type="checkbox" class="checkbox pmTog" data-id="${m.id}" ${m.done?'checked':''}><div class="main"><div class="t" style="${m.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(m.title)}</div></div></div>`).join(''):`<p class="help-text">${t('noData')}</p>`}</div>`,r=>{$('#pmAdd',r).onclick=async()=>{const tt=$('#pmT',r).value.trim();if(!tt)return;await persist('projectMilestones',{id:uid(),projectId:p.id,title:tt,done:false,createdAt:nowMs()});openProjDetail(p);render();};$$('.pmTog',r).forEach(cb=>cb.onchange=async()=>{const m=CACHE.projectMilestones.find(x=>x.id===cb.dataset.id);if(!m)return;m.done=cb.checked;await persist('projectMilestones',m);render();});});}

/* ---------- Notes ---------- */
function vNotes(){const l=CACHE.notes.filter(n=>!n.deletedAt).sort((a,b)=>b.updatedAt-a.updatedAt);return `<div class="view-head"><div><h1>${t('notes')}</h1></div><button class="btn primary sm" id="addNote">+ ${LANG==='ar'?'ملاحظة':'Note'}</button></div>${l.length?`<div class="grid g2">${l.map(n=>`<div class="card"><div style="font-weight:650">${esc(n.title||'(untitled)')}</div><div class="help-text" style="margin:6px 0;white-space:pre-wrap;max-height:120px;overflow:hidden">${esc((n.body||'').slice(0,200))}</div><div class="help-text">${new Date(n.updatedAt).toLocaleString()}</div><div style="margin-top:10px;display:flex;gap:6px"><button class="btn ghost sm noteEdit" data-id="${n.id}">✎</button><button class="btn ghost sm noteDel" data-id="${n.id}">🗑</button></div></div>`).join('')}</div>`:`<div class="card empty"><div class="ico">📝</div><h3>${t('noData')}</h3><button class="btn primary" id="emptyNote">+ ${LANG==='ar'?'ملاحظة':'Note'}</button></div>`}`;}

/* ---------- Analytics ---------- */
function vAnalytics(){const[ms,me]=monthRange();const ft=financeTotals(ms,me);const all=financeTotals(null,null);const cats=CACHE.categories.filter(c=>c.kind==='expense');const catData=cats.map(c=>{let v=0;for(const tr of CACHE.transactions){if(tr.deletedAt||tr.type!=='expense'||tr.categoryId!==c.id)continue;v+=toBaseMinor(tr.amountMinor,tr.currency);}return {label:c.name,value:v};}).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,6);return `<div class="view-head"><div><h1>${t('analytics')}</h1></div></div><div class="grid g4" style="margin-bottom:16px"><div class="card"><div class="stat"><span class="label">${LANG==='ar'?'الدخل الكلي':'Total income'}</span><span class="value mono pos">${baseFmt(all.income)}</span></div></div><div class="card"><div class="stat"><span class="label">${LANG==='ar'?'المصروف الكلي':'Total expense'}</span><span class="value mono neg">${baseFmt(all.expense)}</span></div></div><div class="card"><div class="stat"><span class="label">${LANG==='ar'?'صافي':'Net'}</span><span class="value mono ${all.net>=0?'pos':'neg'}">${baseFmt(all.net)}</span></div></div><div class="card"><div class="stat"><span class="label">${LANG==='ar'?'هذا الشهر':'This month'}</span><span class="value mono">${baseFmt(ft.net)}</span></div></div></div><div class="card"><h3 style="margin-bottom:14px">${LANG==='ar'?'المصروف حسب الفئة':'Expense by category'}</h3>${catData.length?`<div class="chart-wrap">${barChart(catData)}</div>`:`<p class="help-text">${t('noData')}</p>`}</div>`;}

function bindSearch(){$('#sq').oninput=()=>{const q=$('#sq').value.trim().toLowerCase();if(!q){$('#sResults').innerHTML='';return;}const res=[];CACHE.tasks.filter(x=>!x.deletedAt&&(x.title||'').toLowerCase().includes(q)).forEach(x=>res.push(['Task',x.title,x.id,'tasks']));CACHE.notes.filter(x=>!x.deletedAt&&((x.title||'')+(x.body||'')).toLowerCase().includes(q)).forEach(x=>res.push(['Note',x.title,x.id,'notes']));CACHE.journal.filter(x=>((x.title||'')+(x.body||'')).toLowerCase().includes(q)).forEach(x=>res.push(['Journal',x.title,x.id,'journal']));CACHE.goals.filter(x=>!x.deletedAt&&(x.title||'').toLowerCase().includes(q)).forEach(x=>res.push(['Goal',x.title,x.id,'goals']));CACHE.projects.filter(x=>!x.deletedAt&&(x.name||'').toLowerCase().includes(q)).forEach(x=>res.push(['Project',x.name,x.id,'projects']));$('#sResults').innerHTML=res.length?`<div class="card pad0"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('type')}</th><th>${t('title')}</th><th></th></tr></thead><tbody>${res.map(([typ,title,id,view])=>`<tr><td><span class="pill blue">${typ}</span></td><td>${esc(title)}</td><td><button class="btn ghost sm" onclick="window.__goTo('${view}')">→</button></td></tr>`).join('')}</tbody></table></div></div>`:`<div class="card empty"><p>${t('noData')}</p></div>`;};}

/* ---------- Archive ---------- */
function vArchive(){const tx=CACHE.transactions.filter(x=>x.deletedAt);const no=CACHE.notes.filter(x=>x.deletedAt);const go=CACHE.goals.filter(x=>x.deletedAt);const acc=CACHE.accounts.filter(x=>x.archived);return `<div class="view-head"><div><h1>${t('archive')}</h1></div></div><div class="grid g2"><div class="card"><h3>${LANG==='ar'?'معاملات محذوفة':'Deleted transactions'}</h3>${tx.length?tx.map(x=>`<div class="list-item"><div class="main"><div class="t">${esc(x.note||x.type)}</div><div class="s">${esc(x.date)}</div></div><button class="btn sm" onclick="window.__restoreTx('${x.id}')">${t('restore')}</button></div>`).join(''):`<p class="help-text">${t('noData')}</p>`}</div><div class="card"><h3>${LANG==='ar'?'ملاحظات محذوفة':'Deleted notes'}</h3>${no.length?no.map(x=>`<div class="list-item"><div class="main"><div class="t">${esc(x.title)}</div></div><button class="btn sm" onclick="window.__restoreNote('${x.id}')">${t('restore')}</button></div>`).join(''):`<p class="help-text">${t('noData')}</p>`}</div><div class="card"><h3>${LANG==='ar'?'أهداف محذوفة':'Deleted goals'}</h3>${go.length?go.map(x=>`<div class="list-item"><div class="main"><div class="t">${esc(x.title)}</div></div><button class="btn sm" onclick="window.__restoreGoal('${x.id}')">${t('restore')}</button></div>`).join(''):`<p class="help-text">${t('noData')}</p>`}</div><div class="card"><h3>${LANG==='ar'?'حسابات مؤرشفة':'Archived accounts'}</h3>${acc.length?acc.map(x=>`<div class="list-item"><div class="main"><div class="t">${esc(x.name)}</div></div><button class="btn sm" onclick="window.__restoreAcc('${x.id}')">${t('restore')}</button></div>`).join(''):`<p class="help-text">${t('noData')}</p>`}</div></div>`;}

/* ---------- Settings ---------- */
function vSettings(){return `<div class="view-head"><div><h1>${t('settings')}</h1></div></div><div class="grid g2"><div class="card"><h3 style="margin-bottom:14px">${LANG==='ar'?'التفضيلات':'Preferences'}</h3><div class="field"><label>${t('appName')}</label><input class="input" id="setName" value="${esc(S.appName)}"></div><div class="row"><div class="field"><label>${t('language')}</label><select class="input" id="setLang"><option value="en" ${LANG==='en'?'selected':''}>English</option><option value="ar" ${LANG==='ar'?'selected':''}>العربية</option></select></div><div class="field"><label>${t('theme')}</label><select class="input" id="setTheme"><option value="dark" ${S.theme==='dark'?'selected':''}>${t('dark')}</option><option value="light" ${S.theme==='light'?'selected':''}>${t('light')}</option></select></div></div><div class="field"><label>${t('currency')}</label><select class="input" id="setCur">${CURRENCIES.map(c=>`<option value="${c}" ${S.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn primary" id="setSave" style="width:100%;justify-content:center">${t('save')}</button></div><div class="card"><h3 style="margin-bottom:14px">${LANG==='ar'?'البيانات':'Data'}</h3><div style="display:flex;flex-direction:column;gap:10px"><button class="btn" id="backupBtn">${t('backup')} (JSON)</button><button class="btn" id="csvBtn">${LANG==='ar'?'تصدير المعاملات':'Export transactions CSV'}</button><label class="btn" style="cursor:pointer;text-align:center">${t('restore')}<input type="file" accept=".json" id="restoreFile" style="display:none"></label><button class="btn danger" id="resetBtn">${LANG==='ar'?'مسح كل البيانات':'Clear all data'}</button></div><p class="help-text" style="margin-top:14px">${LANG==='ar'?'ملاحظة: البيانات مخزنة محليًا في IndexedDB بدون تشفير.':'Note: Data is stored locally in IndexedDB without encryption.'}</p></div></div>`;}
function bindSettings(){$('#setSave').onclick=async()=>{await saveSetting('appName',$('#setName').value.trim()||'OSAMA');await saveSetting('language',$('#setLang').value);await saveSetting('theme',$('#setTheme').value);await saveSetting('currency',$('#setCur').value);await loadSettings();render();toast(t('saved'),'ok');};$('#backupBtn').onclick=async()=>{const data={version:1,exportedAt:nowMs(),settings:S,stores:{}};for(const s of Object.keys(STORES))data.stores[s]=CACHE[s];const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='osama-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded','ok');};$('#csvBtn').onclick=()=>{const rows=[['Date','Type','Amount','Currency','Category','Account','Note']];for(const tr of CACHE.transactions){if(tr.deletedAt)continue;const c=CACHE.categories.find(x=>x.id===tr.categoryId),a=CACHE.accounts.find(x=>x.id===tr.accountId);rows.push([tr.date,tr.type,fromMinor(tr.amountMinor,tr.currency),tr.currency,c?c.name:'',a?a.name:'',(tr.note||'').replace(/,/g,';')]);}const csv=rows.map(r=>r.join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='osama-transactions-'+todayISO()+'.csv';a.click();URL.revokeObjectURL(a.href);};$('#restoreFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text();const data=JSON.parse(text);if(!data.stores){toast('Invalid backup','err');return;}confirmDialog('Restore?',LANG==='ar'?'سيتم استبدال كل البيانات الحالية.':'This will replace all current data.',async()=>{for(const s of Object.keys(STORES)){await dbClear(s);}for(const s of Object.keys(data.stores)){if(!CACHE[s])continue;for(const rec of data.stores[s]){try{await dbPut(s,rec);}catch(err){console.warn('skip',err);}}}if(data.settings)for(const [k,v] of Object.entries(data.settings)){await dbPut('settings',{key:k,value:v});}await loadAll();await loadSettings();buildNav();render();toast('Restored','ok');},true);}catch(err){toast('Restore failed: '+err.message,'err');}};$('#resetBtn').onclick=()=>{confirmDialog(LANG==='ar'?'مسح كل شيء':'Clear all data',LANG==='ar'?'لا يمكن التراجع.':'Cannot be undone.',async()=>{for(const s of Object.keys(STORES)){await dbClear(s);}await loadAll();await seedDefaults();await loadSettings();buildNav();render();toast('Cleared','ok');},true);};}

/* ---------- Help ---------- */
function vHelp(){return `<div class="view-head"><div><h1>${t('help')}</h1></div></div><div class="card"><h3 style="margin-bottom:12px">${LANG==='ar'?'دليل سريع':'Quick guide'}</h3><div class="help-text" style="line-height:1.9">${LANG==='ar'?`<p><b>البدء:</b> التطبيق يعمل مباشرة بدون كلمة مرور. البيانات تُحفظ في متصفحك (IndexedDB).</p><p><b>النسخ الاحتياطي:</b> من الإعدادات → نسخة احتياطية. احفظ نسخة دوريًا.</p><p><b>الاستعادة:</b> الإعدادات → استعادة، اختر ملف JSON.</p><p><b>اللغات:</b> بدّل بين العربية والإنجليزية من الشريط العلوي.</p><p><b>حدود:</b> لا يوجد Service Worker (ملف واحد)، لا إشعارات، لا مشاركة بين الأجهزة.</p>`:`<p><b>Getting started:</b> App opens directly, no password. Data is stored in your browser (IndexedDB).</p><p><b>Backup:</b> Settings → Backup. Save regularly.</p><p><b>Restore:</b> Settings → Restore, pick JSON file.</p><p><b>Languages:</b> Toggle AR/EN in top bar.</p><p><b>Limits:</b> No Service Worker (single file), no notifications, no cross-device sync.</p>`}</div></div>`;}

/* ---------- Seed ---------- */
async function seedDefaults(){await persist('categories',{id:uid(),name:'Food',kind:'expense',createdAt:nowMs()});await persist('categories',{id:uid(),name:'Transport',kind:'expense',createdAt:nowMs()});await persist('categories',{id:uid(),name:'Salary',kind:'income',createdAt:nowMs()});}

/* ---------- Init ---------- */
async function init(){
  try{
    await openDB();
    await loadAll();
    await loadSettings();
    if(!CACHE.categories.length) await seedDefaults();
    buildNav();
    render();
    $('#themeBtn').onclick=async()=>{S.theme=S.theme==='dark'?'light':'dark';await saveSetting('theme',S.theme);document.body.classList.toggle('light',S.theme==='light');};
    $('#langBtn').onclick=async()=>{S.language=S.language==='en'?'ar':'en';await saveSetting('language',S.language);await loadSettings();buildNav();render();};
    $('#collapseBtn').onclick=()=>$('#sidebar').classList.toggle('collapsed');
    $('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('mobile-open');
    if(window.innerWidth<720) $('#mobileMenu').style.display='';
  }catch(e){
    document.body.innerHTML=`<div style="padding:40px;font-family:sans-serif"><h2>Could not start OSAMA</h2><p>${esc(e.message)}</p><p>Try a modern browser (Chrome, Edge, Firefox, Safari) and make sure IndexedDB is enabled.</p></div>`;
  }
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
